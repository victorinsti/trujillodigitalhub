    :root {
      --bg:#07101f; --panel:#0d1a2d; --line:#203c5d;
      --ink:#f4f8ff; --muted:#a7b8d0; --blue:#2588ff;
      --cyan:#70dcff; --green:#5ee5a6; --red:#ff7185;
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0; background:var(--bg); color:var(--ink);
      font:15px Manrope,Arial,sans-serif;
    }

    button,input,select,textarea { font:inherit; }
    button { border:0; cursor:pointer; }
    a { color:inherit; text-decoration:none; }

    .header {
      height:74px; padding:0 max(20px,6vw); display:flex; align-items:center;
      gap:25px; position:sticky; top:0; z-index:50;
      background:#07101ff2; border-bottom:1px solid #173054;
      backdrop-filter:blur(14px);
    }

    .brand { display:flex; align-items:center; gap:10px; font-size:10px; letter-spacing:1px; line-height:1.1; }
    .brand b { font-size:13px; }
    .brand-mark {
      width:36px; height:36px; display:grid; place-items:center;
      border-radius:11px; background:linear-gradient(135deg,#6cddff,#1760e9);
      font:700 22px "Space Grotesk"; box-shadow:0 0 25px #2588ff88;
    }

    nav { display:flex; gap:23px; margin:auto; color:var(--muted); }
    nav a:hover { color:#fff; }

    .header-actions { display:flex; gap:8px; }
    .header-actions button,.menu {
      padding:9px 12px; border-radius:10px; color:#fff; background:#11233d;
    }

    #cart-count {
      display:inline-grid; place-items:center; min-width:18px; height:18px;
      border-radius:50%; background:var(--blue); font-size:11px; font-style:normal;
    }

    .menu { display:none; }
    .admin-link { border:1px solid #385a84!important; background:transparent!important; }

    .hero {
      min-height:570px; padding:80px max(22px,9vw);
      display:grid; grid-template-columns:1.05fr .95fr; align-items:center;
      overflow:hidden;
      background:
        radial-gradient(circle at 82% 38%,#1265d04c,transparent 28%),
        linear-gradient(135deg,#09162a,#07101f 65%);
    }

    .eyebrow {
      color:var(--cyan); font-weight:800; font-size:12px;
      letter-spacing:1.4px; text-transform:uppercase;
    }

    h1,h2,h3 { font-family:"Space Grotesk",sans-serif; }
    .hero h1 { max-width:700px; margin:18px 0; font-size:clamp(43px,6vw,76px); line-height:.98; }
    .hero h1 em { color:var(--cyan); font-style:normal; }
    .hero p { max-width:560px; color:var(--muted); font-size:17px; line-height:1.7; }

    .actions { display:flex; gap:12px; margin-top:28px; }
    .primary,.secondary {
      display:inline-block; padding:13px 19px; border-radius:11px; font-weight:800;
    }

    .primary {
      background:linear-gradient(135deg,#2996ff,#3467ed); color:#fff;
      box-shadow:0 10px 25px #1264bd55;
    }

    .secondary { border:1px solid #315178; background:transparent; color:#e2efff; }

    .trubi-stage { position:relative; height:440px; display:grid; place-items:center; }
    .trubi-orb {
      width:min(340px,72vw); aspect-ratio:1; border-radius:50%;
      border:1px solid #4ac8ff77;
      background:radial-gradient(circle,#217ed955,transparent 65%);
      box-shadow:inset 0 0 60px #218ff333,0 0 90px #1374ed44;
      animation:float 5s ease-in-out infinite;
    }

    .trubi-image {
      position:absolute; max-width:100%; height:440px; object-fit:contain;
      filter:drop-shadow(0 22px 30px #0009);
      animation:float 5s ease-in-out infinite;
    }

    .trubi-placeholder {
      position:absolute; padding:22px; border:1px dashed #6ddcff88;
      border-radius:20px; background:#0b1d35e8; text-align:center;
    }

    @keyframes float {
      50% { transform:translateY(-14px); }
    }

    .section { padding:75px max(22px,9vw); }
    .dark { background:#09182b; }
    .section h2 { margin:7px 0 25px; font-size:clamp(28px,4vw,43px); }
    .section-head { display:flex; justify-content:space-between; align-items:end; gap:20px; }
    .muted { color:var(--muted); }

    .categories,.grid,.stats {
      display:grid; grid-template-columns:repeat(4,1fr); gap:16px;
    }

    .category,.product,.stat,.form-card,.summary,.admin-card {
      border:1px solid var(--line); border-radius:17px; background:#0c1a2d;
    }

    .category { padding:22px; transition:.25s; }
    .category:hover,.product:hover { transform:translateY(-5px); border-color:#398cff; }
    .category .icon { font-size:27px; }
    .category h3 { margin:13px 0 5px; }
    .category p { margin:0 0 10px; color:var(--muted); font-size:13px; }

    .product { overflow:hidden; transition:.25s; }
    .product-img {
      height:175px; display:grid; place-items:center;
      background:linear-gradient(135deg,#163963,#0b1d36);
      color:#b6eaff; font:800 25px "Space Grotesk"; letter-spacing:2px;
    }

    .product-body { padding:17px; }
    .product h3 { margin:10px 0 5px; font-size:16px; }
    .badge {
      display:inline-block; padding:5px 8px; border-radius:20px;
      background:#1f70de; font-size:10px; font-weight:800;
    }

    .offer { background:#d84668; }
    .price { font:700 20px "Space Grotesk"; }
    .old { margin-left:6px; color:#8293a9; font-size:13px; text-decoration:line-through; }
    .stock { color:var(--green); font-size:12px; }
    .out { color:var(--red); }

    .card-actions { display:flex; gap:8px; }
    .card-actions button {
      flex:1; padding:10px; border-radius:9px; color:#fff; background:#17477c;
    }

    .card-actions .view { background:#15243a; }

    .catalog-tools { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:25px; }
    input,select,textarea {
      padding:12px; border:1px solid #2a476b; border-radius:9px;
      background:#0d1c30; color:#fff;
    }

    .catalog-tools input { flex:1; min-width:210px; }

    .promo {
      padding:30px; border:1px solid #277bdb; border-radius:20px;
      background:linear-gradient(110deg,#0d3265,#132552);
      display:flex; justify-content:space-between; align-items:center; gap:20px;
    }

    .drawer {
      position:fixed; top:0; right:0; z-index:100; width:min(410px,100%);
      height:100dvh; padding:22px; overflow:auto; background:#0b192b;
      transform:translateX(105%); transition:.3s;
    }

    .drawer.open { transform:none; }
    .drawer-head { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); }
    .drawer-head button { color:#fff; background:none; font-size:30px; }
    .shade { position:fixed; inset:0; z-index:90; display:none; background:#0009; }
    .shade.show { display:block; }

    .line-item {
      display:grid; grid-template-columns:1fr auto; gap:12px;
      padding:16px 0; border-bottom:1px solid var(--line);
    }

    .qty { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .qty button { width:26px; height:26px; border-radius:6px; background:#1a3454; color:#fff; }
    .total { margin:20px 0; font:700 20px "Space Grotesk"; }

    .empty { padding:45px 10px; text-align:center; }
    .empty img { width:130px; height:130px; object-fit:cover; border-radius:50%; box-shadow:0 0 30px #2588ff77; }

    .checkout {
      max-width:1100px; margin:auto; display:grid;
      grid-template-columns:1.25fr .75fr; gap:25px;
    }

    .form-card,.summary,.admin-card { padding:25px; }
    form { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:grid; gap:6px; color:#b8c9dd; font-size:13px; }
    .full { grid-column:1/-1; }

    .row {
      display:flex; justify-content:space-between; gap:10px;
      padding:10px 0; border-bottom:1px solid #1b314e;
    }

    .success { max-width:720px; margin:auto; text-align:center; }
    .check {

    .admin { max-width:1200px; margin:auto; }
    .admin-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
    .admin-tabs button { padding:10px 13px; border-radius:9px; background:#142741; color:#fff; }
    .stat { padding:18px; }
    .stat b { display:block; margin-top:7px; font:700 26px "Space Grotesk"; }

    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { padding:12px; text-align:left; border-bottom:1px solid var(--line); }

    #toast {
      position:fixed; right:20px; bottom:20px; z-index:200;
      padding:12px 16px; border-radius:10px; background:#1b5c9c;
      opacity:0; transform:translateY(15px); transition:.25s;
    }

    #toast.show { opacity:1; transform:none; }

    footer {
      display:grid; grid-template-columns:2fr 1fr 1fr; gap:30px;
      padding:55px max(22px,9vw); background:#050b14; color:#aabbd0;
    }

    footer section { display:flex; flex-direction:column; gap:8px; }
    footer h4 { margin:0; color:#fff; }

    @media(max-width:800px) {
      .header { height:66px; padding:0 16px; gap:10px; }
      .menu { display:block; }

        padding:18px; background:#0b192b; flex-direction:column;
      }

      .header.menu-open nav { display:flex; }
      .admin-link { display:none!important; }
      .hero { padding:60px 22px; grid-template-columns:1fr; text-align:center; }
      .hero p { margin-inline:auto; }
      .actions { justify-content:center; }
      .trubi-stage { height:300px; }
      .trubi-image { height:315px; }
      .categories,.grid { grid-template-columns:repeat(2,1fr); }
      .stats { grid-template-columns:repeat(2,1fr); }
      .checkout { grid-template-columns:1fr; }
      .section { padding:54px 22px; }
      footer { grid-template-columns:1fr; }
    }

    @media(max-width:460px) {
      .categories,.grid { grid-template-columns:1fr; }
      .hero h1 { font-size:42px; }
      .trubi-stage { height:240px; }
      .trubi-image { height:250px; }
      .header-actions button:first-child { display:none; }
    }
  </style>

    function money(value) {
      return new Intl.NumberFormat("es-MX", {

    function toast(message) {
      const element = document.querySelector("#toast");
      element.textContent = message;

      setTimeout(() => element.classList.remove("show"), 2400);

    function cartItems() {
      const state = getState();
      return state.cart.map(item => {
        const product = products.find(product => product.id === item.id);
        return product ? { ...product, qty:item.qty } : null;
      }).filter(Boolean);
    }

    function cartTotals() {
      const items = cartItems();
      const subtotal = items.reduce((total,item) => total + item.price * item.qty, 0);
      return { subtotal, total:subtotal };
    }

    function addToCart(id) {
      const state = getState();
      const product = products.find(item => item.id === id);

      if (!product || product.stock <= 0) {
        toast("Este producto está agotado.");
        return;
      }

      const item = state.cart.find(item => item.id === id);

      if (item) {
        item.qty = Math.min(item.qty + 1, product.stock);
      } else {
        state.cart.push({ id, qty:1 });
      }

      saveState(state);
      renderCart();
      toast("Producto agregado al carrito.");
    }

    function changeQty(id, amount) {
      const state = getState();
      const item = state.cart.find(item => item.id === id);
      const product = products.find(product => product.id === id);

      if (!item || !product) return;

      item.qty = Math.max(0, Math.min(product.stock, item.qty + amount));
      state.cart = state.cart.filter(item => item.qty > 0);
      saveState(state);
      renderCart();
    }

        if (sort === "low") filtered.sort((a,b) => a.price - b.price);
        if (sort === "high") filtered.sort((a,b) => b.price - a.price);

    });

    document.querySelector("#shade").addEventListener("click", () => {
      document.querySelector("#drawer").classList.remove("open");
      document.querySelector("#shade").classList.remove("show");
    });

    document.querySelector("#menu-btn").addEventListener("click", () => {
      document.querySelector(".header").classList.toggle("menu-open");
    });

    document.querySelector("#search-btn").addEventListener("click", () => {
      location.hash = "#tienda";
      setTimeout(() => document.querySelector("#search")?.focus(), 100);
    });

    

    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
