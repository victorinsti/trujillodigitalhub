body{

header{

table{

.glass-card{

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    updateDoc,
    doc,
    addDoc,
    setDoc,
    query,
    where,
    deleteDoc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCQa5lpfZ2owUu47CBO6Pe5-wOymUX7wa0",
    authDomain:"campusconnect-9ac9c.firebaseapp.com",
    projectId:"campusconnect-9ac9c"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let datosGlobales = [];
let alumnoLogueado = null;
// ===== CONFIGURACIÓN DEL ADMINISTRADOR =====
const ADMIN = {
    usuario: "Victor",
    password: "A1VicSam"
};

async function cargarDatos(){

    const snap =
        await getDocs(collection(db,"alumnos"));

    datosGlobales = snap.docs.map(doc => ({
        id:doc.id,
        ...doc.data()
    }));

}
// ============================
// CARGAR MATERIAS
// ============================

async function cargarMaterias(){

    const snap = await getDocs(collection(db,"materias"));
    console.log("Materias encontradas:", snap.size);

snap.forEach(docu=>{
    console.log(docu.id, docu.data());
});

    const select = document.getElementById("newMateria");
    const lista = document.getElementById("listaMaterias");

    select.innerHTML="";
    lista.innerHTML="";

    snap.forEach(docu=>{

        const materia = docu.data();

        // Agregar al selector
        select.innerHTML += `
            <option value="${materia.nombre}">
                ${materia.nombre}
            </option>
        `;

        // Mostrar en la lista
        lista.innerHTML += `
            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                background:white;
                color:black;
                padding:10px;
                margin-bottom:8px;
                border-radius:10px;
            ">

                <strong>${materia.nombre}</strong>

                <button
                    onclick="eliminarMateria('${docu.id}')"
                    style="
                        background:#dc2626;
                        color:white;
                        border:none;
                        padding:8px 12px;
                        border-radius:8px;
                        cursor:pointer;
                    ">

                    Eliminar

                </button>

            </div>
        `;

    });

}
// =======================================
// CREAR MATERIA
// =======================================

window.crearMateria = async () => {

    const nombre = document
        .getElementById("nuevaMateria")
        .value
        .trim();

    if (nombre === "") {

        alert("Escribe el nombre de la materia.");

        return;

    }

    // Verificar si ya existe
    const consulta = query(
        collection(db, "materias"),
        where("nombre", "==", nombre)
    );

    const existe = await getDocs(consulta);

    if (!existe.empty) {

        alert("Esa materia ya existe.");

        return;

    }

    await addDoc(
        collection(db, "materias"),
        {
            nombre: nombre
        }
    );

    document.getElementById("nuevaMateria").value = "";

    await cargarMaterias();

};
// =======================================
// ELIMINAR MATERIA
// =======================================

window.eliminarMateria = async (id) => {

    if (!confirm("¿Eliminar esta materia?")) {

        return;

    }

    await deleteDoc(
        doc(db, "materias", id)
    );

    await cargarMaterias();

};

window.login = async () => {

    await cargarDatos();

    const usuario = document
        .getElementById("userInput")
        .value
        .trim();

    // ===== ADMINISTRADOR =====
    if (usuario === ADMIN.usuario) {

        const password = prompt("Contraseña del administrador:");

        if (password === ADMIN.password) {

            abrirAdmin();
            return;

        }

        alert("Contraseña incorrecta");
        return;
    }

    // ===== ALUMNO =====
    const encontrados = datosGlobales.filter(a =>
        String(a.matricula).trim() === usuario
    );

    if (encontrados.length === 0) {

        alert("Matrícula no encontrada");
        return;

    }

    alumnoLogueado = encontrados;

    abrirPortalAlumno();

};
async function abrirAdmin(){

    document
    .getElementById("auth-screen")
    .style.display = "none";

    document
    .getElementById("panel-admin")
    .style.display = "block";

    await cargarDatos();

    await cargarMaterias();

    llenarMaterias();

    renderTabla(datosGlobales);

}

function abrirPortalAlumno(){

    document
    .getElementById("auth-screen")
    .style.display = "none";

    document
    .getElementById("portal-alumno")

    const alumno = alumnoLogueado[0];

    document

    .textContent =

    const cards =
        document.getElementById("alumno-cards");

    cards.innerHTML = "";

    alumnoLogueado.forEach(materia => {

        cards.innerHTML += `

            <div class="score-card">

                    color:#60a5fa;

                    ${Number(materia.promedio).toFixed(1)}

                ">

                    <span>P2 ${materia.p2}</span>

}

function renderTabla(datos){

    const tabla =
        document.getElementById("tabla");

    tabla.innerHTML = "";

    datos.forEach(d => {

        tabla.innerHTML += `

            <tr>

                <td>${d.matricula}</td>

                <td>${d.nombre}</td>

                <td>${d.materia}</td>

                <td>
                    <input
                        value="${d.p1 || 0}"
                        onchange="guardar('${d.id}',this)"
                    >
                </td>

                <td>
                    <input
                        value="${d.p2 || 0}"
                        onchange="guardar('${d.id}',this)"
                    >
                </td>

                <td>
                    <input
                        value="${d.p3 || 0}"
                        onchange="guardar('${d.id}',this)"
                    >
                </td>

                <td>
                    ${Number(d.promedio || 0).toFixed(1)}
                </td>

            </tr>

        `;

    });

}

function llenarMaterias(){

    const filtro = document.getElementById("filtroMateria");

    const materias = [...new Set(
        datosGlobales
            .map(a => a.materia)
            .filter(Boolean)
    )].sort();

    filtro.innerHTML = `
        <option value="Todas">
            Todas las materias
        </option>
    `;

    materias.forEach(m => {

        filtro.innerHTML += `
            <option value="${m}">
                ${m}
            </option>
        `;

    });

}
window.filtrar = () => {

    const texto =
        document
        .getElementById("buscarMatricula")
        .value
        .toLowerCase();

    const materia =
        document
        .getElementById("filtroMateria")
        .value;

    const filtrados =
        datosGlobales.filter(d => {

            const coincideMatricula =
                d.matricula
                .toLowerCase()
                .includes(texto);

            const coincideMateria =
                materia === "Todas"
                || d.materia === materia;

            return coincideMatricula
                && coincideMateria;

        });

    renderTabla(filtrados);

};

window.guardar = async (id,input) => {

    const row =
        input.parentElement.parentElement;

    const inputs =
        row.querySelectorAll("input");

    const p1 =
        parseFloat(inputs[0].value) || 0;

    const p2 =
        parseFloat(inputs[1].value) || 0;

    const p3 =
        parseFloat(inputs[2].value) || 0;

    const promedio =
        (p1+p2+p3)/3;

    await updateDoc(
        doc(db,"alumnos",id),
        {
            p1,
            p2,
            p3,
            promedio
        }
    );

    row.cells[6].textContent =
        promedio.toFixed(1);

};

window.generarBoletaPDF = () => {
    if (!alumnoLogueado) return;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const alumno = alumnoLogueado[0];
    
    // --- 1. CONFIGURACIÓN DE COLORES ---
    const azulPrimario = [15, 23, 42]; // Slate 900
    const azulAcento = [37, 99, 235];   // Royal Blue

    // --- 2. ENCABEZADO ---
    doc.setFillColor(...azulPrimario);
    doc.rect(0, 0, 210, 35, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(22);
    doc.text("TRUJILLO DIGITAL HUB", 105, 20, { align: "center" });
    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    doc.text("SISTEMA DE GESTIÓN ACADÉMICA", 105, 28, { align: "center" });

    // --- 3. INFO ALUMNO ---
    doc.setTextColor(...azulPrimario);
    doc.setFontSize(12);
    doc.text("REPORTE OFICIAL DE RENDIMIENTO", 20, 50);
    
    doc.setDrawColor(...azulAcento);
    doc.setLineWidth(0.5);
    doc.line(20, 52, 190, 52);

    doc.setTextColor(0, 0, 0);
    doc.setFontSize(10);
    doc.text(`ALUMNO: ${alumno.nombre.toUpperCase()}`, 20, 62);
    doc.text(`MATRÍCULA: ${alumno.matricula}`, 20, 68);
    doc.text(`FECHA DE EMISIÓN: ${new Date().toLocaleDateString()}`, 140, 62);

    // --- 4. TABLA ---
    const filas = alumnoLogueado.map(m => [
        m.materia.toUpperCase(),
        m.p1.toFixed(1),
        m.p2.toFixed(1),
        m.p3.toFixed(1),
        m.promedio.toFixed(1)
    ]);

    doc.autoTable({
        startY: 75,
        head: [["MATERIA", "P1", "P2", "P3", "FINAL"]],
        body: filas,
        theme: 'striped',
        headStyles: { fillColor: azulPrimario, halign: 'center' },
        bodyStyles: { halign: 'center', fontSize: 9 },
        columnStyles: { 0: { halign: 'left', fontStyle: 'bold', cellWidth: 80 } }
    });

    // --- 5. SECCIÓN DE FIRMAS (DINÁMICA) ---
    // Calculamos el final de la tabla para poner las firmas abajo
    const finalY = doc.lastAutoTable.finalY + 45; 

    doc.setDrawColor(180, 180, 180);
    doc.setLineWidth(0.2);

    // Línea Firma Maestro
    doc.line(30, finalY, 85, finalY);
    doc.setFontSize(9);
    doc.setFont("helvetica", "bold");
    doc.text("TEC. VICTOR TRUJILLO", 57.5, finalY + 5, { align: "center" });
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.text("Firma del Titular", 57.5, finalY + 10, { align: "center" });

    // Línea Firma Director
    doc.line(125, finalY, 180, finalY);
    doc.setFontSize(9);
    doc.setFont("helvetica", "bold");
    doc.text("DIRECCIÓN ACADÉMICA", 152.5, finalY + 5, { align: "center" });
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.text("Sello y Firma Autorizada", 152.5, finalY + 10, { align: "center" });

    // Elemento decorativo: Sello digital pequeño
    doc.setDrawColor(...azulAcento);
    doc.setLineWidth(0.5);
    doc.circle(105, finalY - 5, 8);
    doc.setFontSize(6);
    doc.setTextColor(...azulAcento);
    doc.text("TDH", 105, finalY - 6, { align: "center" });
    doc.text("VALIDADO", 105, finalY - 3, { align: "center" });

    // --- 6. PIE DE PÁGINA ---
    doc.setTextColor(150, 150, 150);
    doc.setFontSize(7);
    const hash = Math.random().toString(36).substring(2, 15).toUpperCase();
    doc.text(`ID de Validación Digital: ${hash} | Trujillo Digital Hub © 2026`, 105, 285, { align: "center" });

    doc.save(`Boleta_${alumno.matricula}.pdf`);
};
async function generarMatricula() {

    while (true) {

        // Genera un número aleatorio de 6 dígitos
        const numero = Math.floor(Math.random() * 900000) + 100000;

        const matricula = "TDH" + numero;

        // Verificar que no exista en Firebase
        const q = query(
            collection(db, "alumnos"),
            where("matricula", "==", matricula)
        );

        const snap = await getDocs(q);

        // Si no existe, la usamos
        if (snap.empty) {
            return matricula;
        }

    }

}

// --- FUNCIÓN PARA CREAR ALUMNO (NUEVA) ---
window.registrarAlumno = async () => {

    const nombre = document
        .getElementById("newNombre")
        .value
        .trim();

    const materia = document
        .getElementById("newMateria")
        .value
        .trim();

    if (!nombre || !materia) {

        alert("Completa todos los campos.");
        return;

    }

    try {

        // Buscar si el alumno ya existe por nombre
        const qNombre = query(
            collection(db, "alumnos"),
            where("nombre", "==", nombre)
        );

        const snapNombre = await getDocs(qNombre);

        let matricula;

        if (!snapNombre.empty) {

            // ===== EL ALUMNO YA EXISTE =====

            matricula = snapNombre.docs[0].data().matricula;

            // Verificar que no tenga esa materia
            const yaTiene = snapNombre.docs.some(docu =>
                String(docu.data().materia).trim().toLowerCase() ===
                materia.trim().toLowerCase()
            );

            if (yaTiene) {

                alert("El alumno ya está inscrito en esa materia.");

                return;

            }

        } else {

            // ===== ALUMNO NUEVO =====

            matricula = await generarMatricula();

        }

        // Guardar inscripción
        await addDoc(
            collection(db, "alumnos"),
            {
                nombre,
                matricula,
                materia,
                p1: 0,
                p2: 0,
                p3: 0,
                promedio: 0
            }
        );

        alert("Alumno registrado correctamente.");

        document.getElementById("newNombre").value = "";

        await cargarDatos();

        renderTabla(datosGlobales);

    } catch (error) {

        console.error(error);

        alert("Error al registrar el alumno.");

    }

};

window.unificarAlumnosDuplicados = async () => {

    const confirmar = confirm(
        "Se unificarán alumnos repetidos con el mismo nombre. ¿Continuar?"
    );

    if(!confirmar) return;

    try{

        const snap = await getDocs(
            collection(db,"alumnos")
        );

        const alumnos = snap.docs.map(docu => ({
            id: docu.id,
            ...docu.data()
        }));

        // AGRUPAR POR NOMBRE
        const grupos = {};

        alumnos.forEach(alumno => {

            const nombre = String(
                alumno.nombre || ""
            )
            .trim()
            .toLowerCase();

            if(!nombre) return;

            if(!grupos[nombre]){

                grupos[nombre] = [];

            }

            grupos[nombre].push(alumno);

        });

        // RECORRER CADA GRUPO
        for(const nombre in grupos){

            const grupo = grupos[nombre];

            // SI SOLO HAY UNO NO HACER NADA
            if(grupo.length <= 1) continue;

            // USAR PRIMERA MATRICULA
            const matriculaBase = String(
                grupo[0].matricula || ""
            ).trim();

            const materiasUsadas = [];

            for(const alumno of grupo){

                const materia = String(
                    alumno.materia || ""
                ).trim();

                // SI LA MATERIA YA EXISTE -> BORRAR DUPLICADO
                if(materiasUsadas.includes(materia)){

                    try{

                        await deleteDoc(
                            doc(db,"alumnos",alumno.id)
                        );

                    }catch(e){

                        console.log(
                            "Error eliminando:",
                            e
                        );

                    }

                    continue;

                }

                materiasUsadas.push(materia);

                // ACTUALIZAR MATRICULA
                try{

                    await updateDoc(
                        doc(db,"alumnos",alumno.id),
                        {
                            matricula: matriculaBase
                        }
                    );

                }catch(e){

                    console.log(
                        "Error actualizando:",
                        e
                    );

                }

            }

        }

        alert(
            "Alumnos unificados correctamente"
        );

        location.reload();

    }catch(error){

        console.log(error);

        alert(
            "Error general al unificar alumnos"
        );

    }

};
function cerrarSesion(){

    alumnoLogueado = null;

    document.getElementById("panel-admin").style.display = "none";
    document.getElementById("portal-alumno").style.display = "none";
    document.getElementById("auth-screen").style.display = "flex";

    document.getElementById("userInput").value = "";

}
</script>
